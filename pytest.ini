[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -m "not live and not db" --strict-markers
markers =
    unit: fast, no network, safe on every push
    live: hits the real Anthropic API; costs tokens; run with `pytest -m live`
    judged: LLM-judged qualitative evals (implies live)
    db: requires a real Postgres via TEST_DATABASE_URL
